[package]
name = "embassy_core"
version = "0.1.0"
edition = "2021"
authors = ["HarvestHub"]
license = "MIT OR Apache-2.0"

[dependencies]
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "3ab8af393212b028ff7951536a07e003fe6c1744", features = [
    "stm32wb55cg",
    "time-driver-any",
    "exti",
    "unstable-pac",
] }
embassy-stm32-wpan = { git = "https://github.com/embassy-rs/embassy", rev = "3ab8af393212b028ff7951536a07e003fe6c1744", features = [
    "stm32wb55cg",
    "wb55_ble",
] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "3ab8af393212b028ff7951536a07e003fe6c1744", features = [
    "platform-cortex-m",
    "executor-thread",
] }
embassy-time     = { git = "https://github.com/embassy-rs/embassy", rev = "3ab8af393212b028ff7951536a07e003fe6c1744", features = [
    "tick-hz-32_768",
] }
embassy-sync     = { git = "https://github.com/embassy-rs/embassy", rev = "3ab8af393212b028ff7951536a07e003fe6c1744" }
embassy-futures  = { git = "https://github.com/embassy-rs/embassy", rev = "3ab8af393212b028ff7951536a07e003fe6c1744" }

# Cortex-M / runtime
cortex-m         = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt      = "0.7.5"
embedded-hal     = "1.0.0"
panic-halt       = "1.0"

heapless         = { version = "0.8", default-features = false }
static_cell      = "2"
nb               = "1"

[profile.dev]
codegen-units    = 1
debug            = 2
debug-assertions = true
incremental      = false
opt-level        = "s"
overflow-checks  = true

[profile.release]
codegen-units    = 1
debug            = 2
debug-assertions = false
incremental      = false
lto              = "fat"
opt-level        = "s"
overflow-checks  = false
